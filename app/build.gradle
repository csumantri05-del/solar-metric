plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bsbgroup.solarmetric'
    compileSdk 35

    defaultConfig {
        applicationId "com.bsbgroup.solarmetric"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Untuk rilis Play Store, ganti dengan keystore milik BSB Group.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
